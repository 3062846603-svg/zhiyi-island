user nginx;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 10m;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    access_log /var/log/nginx/access.log;
    server {
        # Private preview through SSH; enable public HTTPS only after ICP filing.
        listen 127.0.0.1:18080;
        server_name _;
        root /opt/zhiyi-island/frontend;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        location / { try_files $uri $uri/ /index.html; }
        location /assets/ {
            try_files $uri =404;
            expires 7d;
        }
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 180s;
        }
        location /files/zhiyi-island/ {
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:9005/zhiyi-island/;
            proxy_set_header Host 127.0.0.1:9005;
        }
    }
}