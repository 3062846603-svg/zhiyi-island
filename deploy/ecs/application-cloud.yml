spring:
  datasource:
    hikari:
      minimum-idle: 1
      maximum-pool-size: 4
  task:
    execution:
      pool:
        core-size: 1
        max-size: 2
        queue-capacity: 20
  ai:
    siliconflow:
      provider: deepseek
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      model: deepseek-v4-flash
      knowledge-model: deepseek-v4-flash
      thinking-enabled: false
      embedding-enabled: false
      options:
        max-tokens: 2048
  mail:
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
server:
  address: 127.0.0.1
  port: 8080
  tomcat:
    threads:
      max: 20
      min-spare: 2
    max-connections: 100
    accept-count: 20
minio:
  public-url: /files
app:
  ai:
    auto-extract-knowledge: false
  test-data:
    import-enabled: false
logging:
  config: file:/etc/zhiyi-island/logback-cloud.xml